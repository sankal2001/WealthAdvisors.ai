name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile project files
        run: python -m compileall app.py kyc_agents schemas tools

      - name: Smoke test imports
        run: python -c "import app; from kyc_agents.onboarding_agent import LIVE_AGENTS_AVAILABLE; print('LIVE_AGENTS_AVAILABLE=', LIVE_AGENTS_AVAILABLE)"